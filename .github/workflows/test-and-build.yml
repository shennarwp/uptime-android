name: Test and Build

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          comment-summary-in-pr: always

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Run Android lint
        run: ./gradlew lint

      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest

      - name: Generate JaCoCo report
        run: ./gradlew jacocoDebugTestReport

      - name: Validate JaCoCo report
        run: |
          report=app/build/reports/jacoco/jacocoDebugTestReport/jacocoDebugTestReport.xml
          test -s "$report"
          python3 - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report = ET.parse(sys.argv[1]).getroot()
          packages = report.findall(".//package")
          sourcefiles = report.findall(".//sourcefile")
          counters = report.findall(".//counter")

          print(
              f"JaCoCo report: {len(packages)} packages, "
              f"{len(sourcefiles)} source files, {len(counters)} counters"
          )
          if not packages or not sourcefiles or not counters:
              raise SystemExit("JaCoCo report is empty or missing source coverage data")
          PY

      - name: Upload coverage to Codecov
        if: ${{ success() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: app/build/reports/jacoco/jacocoDebugTestReport/jacocoDebugTestReport.xml
          flags: android-unit
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build debug APK
        run: ./gradlew assembleDebug
