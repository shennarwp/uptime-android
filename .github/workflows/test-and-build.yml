name: Test and Build

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          comment-summary-in-pr: always

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run Android lint
        run: ./gradlew lint

      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest jacocoDebugTestReport

      - name: Validate JaCoCo report
        run: |
          report=app/build/reports/jacoco/jacocoDebugTestReport/jacocoDebugTestReport.xml
          test -s "$report"
          echo "packages=$(grep -c '<package ' "$report" || true)"
          echo "sourcefiles=$(grep -c '<sourcefile ' "$report" || true)"
          echo "counters=$(grep -c '<counter type=' "$report" || true)"
          sed -n '1,12p' "$report"

      - name: Upload coverage to Codecov
        if: ${{ success() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: app/build/reports/jacoco/jacocoDebugTestReport/jacocoDebugTestReport.xml
          flags: android-unit
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build debug APK
        run: ./gradlew assembleDebug
